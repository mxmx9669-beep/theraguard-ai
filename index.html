<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MediVance AI</title>

<style>

body{
font-family:Inter,Arial;
background:#f6f8fb;
margin:0;
padding:30px;
color:#0f172a
}

.container{
max-width:1100px;
margin:auto
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px
}

.brand{
font-size:26px;
font-weight:800
}

.credit{
font-size:13px;
font-weight:600
}

.card{
background:white;
border-radius:10px;
padding:20px;
margin-bottom:20px;
border:1px solid #e2e8f0
}

.title{
font-weight:700;
margin-bottom:15px
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px
}

input,select{
padding:10px;
border-radius:6px;
border:1px solid #cbd5e1
}

button{
padding:10px 16px;
border:none;
border-radius:6px;
background:#0f172a;
color:white;
font-weight:600;
cursor:pointer
}

button.secondary{
background:#64748b
}

.medication{
border:1px dashed #cbd5e1;
padding:12px;
border-radius:8px;
margin-bottom:10px
}

.answer{
background:#f1f5f9;
padding:15px;
border-radius:8px;
margin-top:15px
}

.quote{
background:white;
border-left:4px solid #0ea5e9;
padding:10px;
margin-top:10px
}

</style>
</head>

<body>

<div class="container">

<div class="header">
<div class="brand">MediVance AI</div>
<div class="credit">Designed & Innovated by Mohammed Al-Ishaq</div>
</div>


<!-- PATIENT PROFILE -->

<div class="card">

<div class="title">Patient Profile</div>

<div class="grid">

<input id="age" placeholder="Age">

<select id="sex">
<option value="">Sex</option>
<option value="M">Male</option>
<option value="F">Female</option>
</select>

<input id="weight" placeholder="Weight kg">

<input id="height" placeholder="Height cm">

<input id="scr" placeholder="Creatinine µmol">

<select id="krt">
<option value="none">No Dialysis</option>
<option value="ihd">HD</option>
<option value="crrt">CRRT</option>
<option value="pirrt">PIRRT</option>
</select>

</div>

</div>



<!-- MEDICATION LIST -->

<div class="card">

<div class="title">Medication List</div>

<div id="medications"></div>

<button onclick="addMedication()">Add Drug</button>

</div>



<!-- RUN REVIEW -->

<div class="card">

<button onclick="runReview()">Run Medication Review</button>

<div id="reviewResult" class="answer"></div>

</div>



<!-- DRUG KNOWLEDGE -->

<div class="card">

<div class="title">Drug Knowledge Assistant</div>

<select id="questionDrug"></select>

<input id="questionText" placeholder="Ask anything about the drug">

<button onclick="askDrug()">Ask</button>

<div id="questionResult" class="answer"></div>

</div>


</div>



<script>

let drugList=[]
let medCount=0


async function loadDrugs(){

const res=await fetch('/api/ask',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({action:'get_drugs'})
})

const data=await res.json()

drugList=data.drugs||[]

populateDrugSelectors()

}


function populateDrugSelectors(){

const q=document.getElementById("questionDrug")

q.innerHTML=''

drugList.forEach(d=>{

let opt=document.createElement("option")

opt.value=d
opt.textContent=d

q.appendChild(opt)

})

}


function addMedication(){

medCount++

const div=document.createElement("div")

div.className="medication"

div.innerHTML=`

<select class="drug"></select>

<input class="indication" placeholder="Indication">

<input class="dose" placeholder="Current Dose">

<input class="freq" placeholder="Frequency">

<input class="route" placeholder="Route">

`

document.getElementById("medications").appendChild(div)

const select=div.querySelector(".drug")

drugList.forEach(d=>{

let opt=document.createElement("option")

opt.value=d
opt.textContent=d

select.appendChild(opt)

})

}



async function runReview(){

const patient={

age:Number(age.value),
sex:sex.value,
weight:Number(weight.value),
height:Number(height.value),
creatinine:Number(scr.value),
krt:krt.value

}


let medications=[]

document.querySelectorAll(".medication").forEach(m=>{

medications.push({

drug:m.querySelector(".drug").value,
indication:m.querySelector(".indication").value,
current_dose:m.querySelector(".dose").value,
frequency:m.querySelector(".freq").value,
route:m.querySelector(".route").value

})

})


const res=await fetch('/api/ask',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
action:'calculate_review',
patient,
medications
})
})

const data=await res.json()

renderReview(data)

}



function renderReview(data){

let html=''

data.medication_review.forEach(r=>{

html+=`<h3>${r.drug}</h3>`

html+=`<p><b>Assessment:</b> ${r.assessment}</p>`

html+=`<p><b>Recommended:</b> ${r.recommended_regimen}</p>`

if(r.monitoring?.length){

html+=`<p><b>Monitoring:</b> ${r.monitoring.join(", ")}</p>`

}

if(r.warnings?.length){

html+=`<p><b>Warnings:</b> ${r.warnings.join(", ")}</p>`

}

})

if(data.global_warnings?.length){

html+=`<h3>Global Warnings</h3>`

data.global_warnings.forEach(w=>{

html+=`<p>⚠ ${w}</p>`

})

}

reviewResult.innerHTML=html

}



async function askDrug(){

const drug=questionDrug.value

const question=questionText.value

const res=await fetch('/api/ask',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
action:'drug_question',
drug,
question
})
})

const data=await res.json()

let html=`<h3>Answer</h3><p>${data.answer}</p>`

if(data.evidence){

html+=`<h3>Evidence</h3>`

data.evidence.forEach(e=>{

html+=`<div class="quote">"${e.quote}"<br><small>${e.source}</small></div>`

})

}

questionResult.innerHTML=html

}



loadDrugs()

addMedication()

</script>

</body>
</html>
