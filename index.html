<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediVance AI - Clinical Knowledge Chat</title>
  <style>
    :root{
      --bg:#f4f7fb;
      --card:#ffffff;
      --line:#d9e3ee;
      --text:#223246;
      --muted:#6d7f95;

      --navy:#123253;
      --blue:#2f7ec7;
      --blue-dark:#2067a8;

      --soft:#f8fbfe;
      --shadow:0 4px 16px rgba(16,42,67,.06);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Arial, Helvetica, sans-serif;
      padding:16px;
    }

    .app{
      max-width:1100px;
      margin:0 auto;
      background:#fff;
      border:1px solid var(--line);
      border-radius:14px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:16px 18px;
      border-bottom:1px solid var(--line);
      background:linear-gradient(180deg,#ffffff,#fbfdff);
    }

    .brand-wrap{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .logo-box{
      width:42px;
      height:42px;
      border-radius:12px;
      background:linear-gradient(135deg,#1e4f87,#46a4d9 55%,#8fd0b4);
      position:relative;
      box-shadow:0 6px 14px rgba(30,79,135,.18);
      flex:0 0 42px;
    }

    .logo-box::before{
      content:"";
      position:absolute;
      left:10px;
      top:8px;
      width:22px;
      height:26px;
      background:#fff;
      clip-path:polygon(44% 0,56% 0,56% 34%,100% 34%,100% 48%,56% 48%,56% 100%,44% 100%,44% 48%,0 48%,0 34%,44% 34%);
      border-radius:2px;
    }

    .brand-sub{
      font-size:11px;
      color:var(--muted);
      margin-top:4px;
      letter-spacing:.2px;
    }

    .brand-title{
      font-size:20px;
      font-weight:800;
      color:#1d5d8e;
      line-height:1.05;
      letter-spacing:.2px;
    }

    .credit{
      font-size:12px;
      color:#617286;
      font-weight:700;
      text-align:right;
      white-space:nowrap;
    }

    .content{
      padding:14px;
      background:#f8fbfd;
    }

    .section{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:10px;
      overflow:hidden;
    }

    .section-bar{
      min-height:46px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 14px;
      font-weight:800;
      color:#fff;
      font-size:14px;
      background:linear-gradient(90deg,var(--navy),#2a4c74);
    }

    .status-pill{
      font-size:11px;
      background:rgba(255,255,255,.9);
      color:#46576c;
      border:1px solid rgba(0,0,0,.06);
      padding:5px 10px;
      border-radius:999px;
      font-weight:800;
    }

    .section-body{
      padding:14px;
    }

    .grid-4{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:12px;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    label{
      font-size:12px;
      font-weight:800;
      color:#5a6f86;
    }

    input, select, textarea{
      width:100%;
      min-width:0;
      border:1px solid #ccd7e4;
      border-radius:8px;
      background:#fff;
      color:#203041;
      font-size:14px;
      padding:10px 11px;
      outline:none;
    }

    input:focus, select:focus, textarea:focus{
      border-color:var(--blue);
      box-shadow:0 0 0 3px rgba(47,126,199,.12);
    }

    textarea{
      resize:vertical;
    }

    .btn-row{
      display:flex;
      justify-content:flex-end;
      gap:8px;
      margin-top:12px;
      flex-wrap:wrap;
    }

    button{
      border:none;
      border-radius:8px;
      padding:10px 16px;
      font-size:13px;
      font-weight:800;
      cursor:pointer;
      transition:.15s ease;
    }

    .btn-primary{
      background:var(--blue);
      color:#fff;
    }

    .btn-primary:hover{background:var(--blue-dark)}

    .btn-secondary{
      background:#eef2f6;
      color:#495d74;
      border:1px solid #d6dee8;
    }

    .chat-box{
      margin-top:14px;
      background:var(--soft);
      border:1px solid #dbe8f4;
      border-radius:10px;
      padding:14px;
      min-height:360px;
      max-height:620px;
      overflow:auto;
    }

    .empty-state{
      color:#6b7a90;
      font-size:14px;
    }

    .msg{
      margin-bottom:14px;
    }

    .bubble{
      border-radius:12px;
      padding:12px 14px;
      line-height:1.7;
      font-size:14px;
      white-space:pre-wrap;
      word-break:break-word;
    }

    .msg-user .bubble{
      background:#dfeefe;
      border:1px solid #c6ddf6;
      margin-left:auto;
      max-width:80%;
    }

    .msg-assistant .bubble{
      background:#fff;
      border:1px solid #d9e3ee;
      max-width:88%;
    }

    .msg-role{
      font-size:11px;
      font-weight:800;
      color:#6b7a90;
      margin-bottom:5px;
    }

    .citations{
      margin-top:8px;
      padding-left:10px;
    }

    .citation-card{
      margin-top:8px;
      background:#fff;
      border-left:4px solid var(--blue);
      border-radius:8px;
      padding:10px 12px;
      border-top:1px solid #d9e3ee;
      border-right:1px solid #d9e3ee;
      border-bottom:1px solid #d9e3ee;
    }

    .citation-meta{
      font-size:12px;
      font-weight:800;
      color:#56697f;
      margin-bottom:6px;
    }

    .citation-quote{
      font-size:13px;
      line-height:1.65;
      color:#223246;
      white-space:pre-wrap;
    }

    .chip-row{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:12px;
    }

    .chip{
      background:#eef2f6;
      color:#495d74;
      border:1px solid #d6dee8;
      border-radius:999px;
      padding:8px 12px;
      font-size:12px;
      font-weight:800;
      cursor:pointer;
    }

    .loading{
      color:#6b7a90;
      font-style:italic;
      font-size:14px;
    }

    .footer{
      text-align:center;
      padding:12px 16px 16px;
      color:#7b8798;
      font-size:11px;
    }

    .footer .credit2{
      margin-top:8px;
      font-weight:800;
      color:#5e6c80;
    }

    @media (max-width: 900px){
      .grid-4{grid-template-columns:repeat(2,1fr)}
      .credit{display:none}
    }

    @media (max-width: 640px){
      .topbar{flex-direction:column; align-items:flex-start}
      .grid-4{grid-template-columns:1fr}
      .btn-row button{width:100%}
      .msg-user .bubble,
      .msg-assistant .bubble{max-width:100%}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand-wrap">
        <div class="logo-box"></div>
        <div>
          <div class="brand-title">MediVance AI</div>
          <div class="brand-sub">Clinical Knowledge Chat</div>
        </div>
      </div>
      <div class="credit">Designed &amp; Innovated by Mohammed Al-Ishaq</div>
    </div>

    <div class="content">
      <div class="section">
        <div class="section-bar">
          <div>Drug Knowledge Assistant</div>
          <div class="status-pill">Source-Locked Chat</div>
        </div>

        <div class="section-body">
          <div class="grid-4">
            <div class="field">
              <label>Source</label>
              <select id="chatSource">
                <option value="">Select a source</option>
              </select>
            </div>

            <div class="field">
              <label>Language Mode</label>
              <select id="chatLanguage">
                <option value="auto">Auto</option>
                <option value="en">English</option>
                <option value="ar">Arabic</option>
              </select>
            </div>

            <div class="field">
              <label>Evidence Mode</label>
              <select id="chatEvidenceMode">
                <option value="standard">Standard</option>
                <option value="strict">Strict</option>
              </select>
            </div>

            <div class="field">
              <label>Conversation</label>
              <button class="btn-secondary" id="clearChatBtn" type="button">Clear Chat</button>
            </div>
          </div>

          <div class="chip-row">
            <button class="chip" type="button" data-chip="What are the main indications?">Indications</button>
            <button class="chip" type="button" data-chip="What is the recommended dose?">Dose</button>
            <button class="chip" type="button" data-chip="What about renal adjustment?">Renal</button>
            <button class="chip" type="button" data-chip="What monitoring is required?">Monitoring</button>
            <button class="chip" type="button" data-chip="What is the administration method?">Administration</button>
            <button class="chip" type="button" data-chip="Quote the relevant text.">Quote</button>
          </div>

          <div class="chat-box" id="chatMessages">
            <div class="empty-state">Choose a source, then start chatting.</div>
          </div>

          <div style="margin-top:14px;">
            <label>Message</label>
            <textarea id="chatInput" rows="4" placeholder="Ask in Arabic or English. Typos are okay."></textarea>
          </div>

          <div class="btn-row">
            <button class="btn-primary" id="sendChatBtn" type="button">Send</button>
          </div>
        </div>
      </div>

      <div class="footer">
        Clinical knowledge assistant. Always verify with institutional protocols.
        <div class="credit2">Designed &amp; Innovated by Mohammed Al-Ishaq</div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "/api/ask";
    let SOURCES = [];
    let CHAT_HISTORY = [];

    const els = {
      chatSource: document.getElementById("chatSource"),
      chatLanguage: document.getElementById("chatLanguage"),
      chatEvidenceMode: document.getElementById("chatEvidenceMode"),
      clearChatBtn: document.getElementById("clearChatBtn"),
      chatMessages: document.getElementById("chatMessages"),
      chatInput: document.getElementById("chatInput"),
      sendChatBtn: document.getElementById("sendChatBtn")
    };

    async function postAPI(payload){
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await res.json().catch(() => ({}));

      if(!res.ok){
        throw new Error(data.details || data.error || "API request failed");
      }

      return data;
    }

    function escapeHtml(str){
      return String(str || "").replace(/[&<>"']/g, m => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m]));
    }

    function renderSources(){
      els.chatSource.innerHTML = `<option value="">Select a source</option>`;
      SOURCES.forEach(source => {
        const opt = document.createElement("option");
        opt.value = source;
        opt.textContent = source;
        els.chatSource.appendChild(opt);
      });
    }

    async function loadSources(){
      try{
        const data = await postAPI({ action: "get_sources" });
        SOURCES = Array.isArray(data.sources) ? data.sources : [];
        renderSources();
      }catch(e){
        els.chatMessages.innerHTML = `<div class="loading">${escapeHtml(e.message || "Failed to load sources.")}</div>`;
      }
    }

    function addUserMessage(text){
      CHAT_HISTORY.push({
        role: "user",
        content: text
      });
      renderChat();
    }

    function addAssistantMessage(answer, citations = []){
      CHAT_HISTORY.push({
        role: "assistant",
        content: answer,
        citations
      });
      renderChat();
    }

    function renderChat(){
      if(!CHAT_HISTORY.length){
        els.chatMessages.innerHTML = `<div class="empty-state">Choose a source, then start chatting.</div>`;
        return;
      }

      let html = "";

      CHAT_HISTORY.forEach(msg => {
        if(msg.role === "user"){
          html += `
            <div class="msg msg-user">
              <div class="msg-role">You</div>
              <div class="bubble">${escapeHtml(msg.content)}</div>
            </div>
          `;
        } else {
          html += `
            <div class="msg msg-assistant">
              <div class="msg-role">Assistant</div>
              <div class="bubble">${escapeHtml(msg.content)}</div>
              ${
                Array.isArray(msg.citations) && msg.citations.length
                  ? `<div class="citations">
                      ${msg.citations.map(c => `
                        <div class="citation-card">
                          <div class="citation-meta">
                            Source: ${escapeHtml(c.source || "Unknown source")}
                            ${c.page ? ` | Page ${escapeHtml(String(c.page))}` : ""}
                          </div>
                          <div class="citation-quote">${escapeHtml(c.quote || "")}</div>
                        </div>
                      `).join("")}
                    </div>`
                  : ""
              }
            </div>
          `;
        }
      });

      els.chatMessages.innerHTML = html;
      els.chatMessages.scrollTop = els.chatMessages.scrollHeight;
    }

    async function sendChatMessage(){
      const source = els.chatSource.value;
      const message = els.chatInput.value.trim();
      const language = els.chatLanguage.value;
      const evidenceMode = els.chatEvidenceMode.value;

      if(!source){
        addAssistantMessage("Please select a source first.", []);
        return;
      }

      if(!message){
        addAssistantMessage("Please enter a message.", []);
        return;
      }

      addUserMessage(message);
      els.chatInput.value = "";

      const loadingIndex = CHAT_HISTORY.length;
      CHAT_HISTORY.push({
        role: "assistant",
        content: "Searching selected source...",
        citations: []
      });
      renderChat();

      try{
        const historyPayload = CHAT_HISTORY
          .filter(m => m.role === "user" || m.role === "assistant")
          .slice(0, -1)
          .map(m => ({
            role: m.role,
            content: m.content
          }));

        const data = await postAPI({
          action: "source_chat",
          source,
          message,
          language,
          evidence_mode: evidenceMode,
          history: historyPayload
        });

        CHAT_HISTORY.splice(loadingIndex, 1);

        addAssistantMessage(
          data.answer || "No answer returned.",
          Array.isArray(data.citations) ? data.citations : []
        );
      }catch(e){
        CHAT_HISTORY.splice(loadingIndex, 1);
        addAssistantMessage(e.message || "Failed to get response.", []);
      }
    }

    function clearChat(){
      CHAT_HISTORY = [];
      renderChat();
    }

    els.sendChatBtn.addEventListener("click", sendChatMessage);

    els.chatInput.addEventListener("keydown", (e) => {
      if(e.key === "Enter" && !e.shiftKey){
        e.preventDefault();
        sendChatMessage();
      }
    });

    els.clearChatBtn.addEventListener("click", clearChat);

    document.querySelectorAll(".chip").forEach(btn => {
      btn.addEventListener("click", () => {
        const chip = btn.dataset.chip || "";
        els.chatInput.value = chip;
        els.chatInput.focus();
      });
    });

    loadSources();
    renderChat();
  </script>
</body>
</html>
